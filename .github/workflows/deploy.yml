name: Deployment
on:
  push:
    branches:
      - main
      - dev
env:
  MONGODB_DB_NAME: git_actions_test
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        PORT: 8080

        # Connect to MongoDB Atlas
        # MONGODB_CONNECTION_PROTOCOL: mongodb+srv
        # MONGODB_CLUSTER_ADDRESS: ${{ secrets.MONGODB_CLUSTER_ADDRESS }}
        # MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
        # MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}

        # Connect to mongodb service
        MONGODB_CONNECTION_PROTOCOL: mongodb
        MONGODB_CLUSTER_ADDRESS: mongodb
        MONGODB_USERNAME: user_1
        MONGODB_PASSWORD: some-pass
    services:
      mongodb:
        image: mongo:9.0
        env:
          MONGO_INITDB_ROOT_USERNAME: user_1
          MONGO_INITDB_ROOT_PASSWORD: some-pass
    steps:
      - name: Output Node version
        run: node -v
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      - name: Run tests
        run: npm test
      - name: Output information
        run: |        
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
          echo "MONGODB_USERNAME: $MONGODB_PASSWORD"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
          echo "MONGODB_USERNAME: $MONGODB_DB_NAME"
